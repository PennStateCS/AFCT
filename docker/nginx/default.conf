# Reverse proxy for the AFCT app: terminates TLS, serves uploaded files, and
# forwards everything else to Next.js.

# Maps the WebSocket upgrade header so proxied connections can upgrade.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream app_upstream {
  zone app_upstream 64k;
  server app:3000;
}

# Access log with timings, for correlating requests with the app's audit log.
# rt = total request time, urt = time the upstream (app) took.
log_format afct '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                '"$http_referer" "$http_user_agent"';

# Redirect all plain HTTP to HTTPS, except the ACME HTTP-01 challenge, which must be
# served over plain HTTP. The app (src/lib/acme.ts) drops the challenge token into the
# shared acme_challenge volume; Let's Encrypt fetches it here to prove domain control.
server {
  listen 80;
  server_name _;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme-challenge;
    default_type "text/plain";
    access_log off;
  }

  location / {
    # Target is written by the entrypoint, so a stack that publishes HTTPS on a non-default
    # port (the dev compose uses 8443) redirects to a port that is actually listening.
    include /etc/nginx/redirect-target.conf;
    return 301 $afct_https_target;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  access_log /var/log/nginx/access.log afct;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # HSTS is written here by the entrypoint, and only when a real cert is active
  # (see write_hsts). Empty on the self-signed fallback.
  include /etc/nginx/hsts.conf;

  # Baseline security response headers, covering anything nginx answers itself. `always` so
  # they're sent on error responses too. The app's own pages override this in `location /`
  # below, because framing there has to allow a registered LMS; these values still apply to
  # /uploads/ and to responses nginx generates without the app. Note: nginx does not merge
  # add_header into a location that declares its own, so these are repeated where needed.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Infrastructure ceiling on request bodies. Kept in step with the app's
  # MAX_UPLOAD_SIZE_MB (src/lib/system-settings.ts) so oversized bodies are rejected
  # here with a 413 instead of streaming into the app. The app enforces the real,
  # admin-configurable per-file limit (<= this). The old 1024M let one request pour
  # ~1 GB into the app before any size check.
  client_max_body_size 50M;

  # Serve uploaded files straight from the shared volume.
  location /uploads/ {
    alias /usr/share/nginx/html/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    # Re-declared here because this location sets its own add_header (see note
    # above). nosniff matters most for user-uploaded content served same-origin.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Everything else goes to the Next.js app.
  location / {
    proxy_pass http://app_upstream;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) X-Forwarded-For with the real client address so a
    # client-supplied header can't spoof it; the app trusts the first entry for
    # audit logging and rate limiting, and nginx is the trusted edge here.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Room for the response *headers*, which the default 4k cannot always hold.
    #
    # Starting an institutional sign-in answers with a redirect to the identity provider plus
    # the cookies that secure it: state, PKCE, nonce, CSRF and the callback URL, alongside a
    # `Location` carrying the whole authorization request. That set goes past 4k comfortably,
    # and nginx answers "upstream sent too big header" with a 502 rather than passing it on,
    # so the button appears to do nothing at all. Nothing in the app can detect this: the
    # response it sent was correct.
    #
    # 16k is the smallest size that fits with room to spare; the buffers are for the body and
    # are separate from this one.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Give large/slow uploads room instead of the 60s default, and stream the
    # body to the app rather than buffering the whole (up to 1 GB) request first.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;
    proxy_request_buffering off;

    # The app owns framing for its own pages, and nginx must not second-guess it.
    #
    # Browsers apply every Content-Security-Policy header on a response and enforce the
    # intersection, so a second header here saying `frame-ancestors 'self'` silently overrules
    # the app however permissive the app's own policy is. X-Frame-Options is worse: it cannot
    # express an allowlist at all, only SAMEORIGIN or DENY.
    #
    # That matters because an LMS embeds its tools. Canvas draws its deep-linking picker as an
    # iframe with no option to open a new tab, and AFCT allows exactly the platforms an
    # administrator has registered (see `src/proxy.ts`). With either header set here, that
    # picker is a blank box and no error explains why.
    #
    # Declaring add_header in this location drops the inherited server-level ones, so the
    # baseline headers worth keeping are repeated. CSP and X-Frame-Options are deliberately
    # absent: the app sets a full policy, including frame-ancestors, on every page it renders.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Lightweight health endpoint (used by the container healthcheck).
  location = /api/health {
    proxy_pass http://app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}
