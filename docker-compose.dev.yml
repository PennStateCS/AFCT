# Development stack: the app with hot reload, an nginx TLS front, Postgres, and
# Prisma Studio. `npm run docker:dev` brings it up.

# Bound container log growth (json-file defaults to unlimited). Applied per service.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: afct-dev
    restart: unless-stopped
    logging: *default-logging

    # Run as root so the source bind mount stays writable across host/container.
    user: '0:0'

    environment:
      NODE_ENV: development
      # Give the dev server a larger V8 heap so Next 16's memory watchdog recycles the
      # worker far less often. Each recycle ("approaching the used memory threshold,
      # restarting") stalls in-flight requests for tens of seconds over the bind mount.
      # Docker has ~16 GB here, so 6 GB leaves plenty of headroom.
      NODE_OPTIONS: '--max-old-space-size=6144'
      # Grading runs in the dedicated `worker` service below; the app never starts one.
      # (Under `next dev --webpack` instrumentation is skipped anyway, but set it
      # explicitly so a Turbopack/native run wouldn't spawn an in-app worker either.)
      RUN_SUBMISSION_WORKER: 'false'
      # No polling. The watcher used to poll every second because the checkout lived on
      # the Windows filesystem and file events did not survive the 9p transport into the
      # container. The checkout is on ext4 inside WSL now, so inotify works and polling
      # only costs memory: walking the tree once a second is what kept pushing the dev
      # server into Next's "approaching the used memory threshold, restarting" recycle.
      # Put CHOKIDAR_USEPOLLING/WATCHPACK_POLLING back if the source ever moves back to a
      # /mnt/c path (or someone runs this from Docker Desktop on Windows directly), since
      # hot reload will not fire there without it.
      #
      # Node serves every filesystem call from libuv's thread pool, which defaults to four
      # threads. That was the ceiling on file I/O when each call was a round trip to the
      # Windows host; it is cheap to keep, and idle threads cost nothing.
      UV_THREADPOOL_SIZE: '32'
      DATABASE_URL: postgres://afct_user:afct_pass@postgres:5432/afct
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: afct_user
      DB_NAME: afct
      WAIT_FOR_DB: 'true'
      MIGRATE_ON_START: 'true'
      SEED_ON_START: 'true'

    # Webpack (not Turbopack) inside Docker. This was originally about the polling above,
    # which is gone; it stays for now because nobody has retested Turbopack's watcher in
    # this container. Native (non-Docker) `npm run dev` keeps Turbopack.
    command: ['npm', 'run', 'dev', '--', '--webpack']

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - '3000:3000'

    volumes:
      # Source, for hot reload.
      - .:/app:cached
      # Container-owned copies so the host doesn't shadow them.
      - afct-dev-node-modules:/app/node_modules
      - afct-dev-next:/app/.next
      # Keep the docs site off the bind mount. Nothing in the container builds Docusaurus,
      # but its dependency tree is 64,782 files, and every one of them is reachable through
      # the Windows bind mount, which Docker Desktop serves over WSL2's 9p transport. A
      # single walk of that tree from inside the container measured 126 SECONDS (the same
      # walk over a container volume: 69ms). Webpack's watcher polls here, so those files
      # were being stat'ed over and over while the compiler queued behind them. Masking
      # them with empty volumes removes 85% of the files on the slow path.
      - afct-dev-docs-node-modules:/app/docs-site/node_modules
      - afct-dev-docs-build:/app/docs-site/build
      - afct-dev-docs-cache:/app/docs-site/.docusaurus
      # Uploads + admin TLS cert on named volumes.
      - afct-dev-uploads-data:/app/public/uploads
      - afct-dev-private-uploads:/private/uploads
      - afct-dev-tls-certs:/app/certs
      # ACME HTTP-01 challenge tokens; nginx serves them over HTTP (Let's Encrypt).
      - afct-dev-acme-challenge:/app/acme-challenge
      # Backups: read-only for listing/downloading; requests go via the trigger volume.
      - afct-dev-db-backups:/backups:ro
      - afct-dev-backup-triggers:/backup-triggers

    healthcheck:
      disable: true

  # Submission evaluator as its own process (mirrors the prod `worker` service). Runs the
  # dev image with the live bind-mounted source via tsx, so the worker starts exactly once
  # instead of re-spawning per webpack bundle context inside the web app (which stacked DB
  # pollers and ground the dev server to a halt). The web `app` no longer runs a worker.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: afct-dev-worker
    restart: unless-stopped
    logging: *default-logging
    # Match the app: root keeps the bind mount writable / node_modules shareable.
    user: '0:0'
    command: ['npx', 'tsx', 'src/worker.ts']

    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://afct_user:afct_pass@postgres:5432/afct
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: afct_user
      DB_NAME: afct
      WAIT_FOR_DB: 'true'
      # The web app owns migrations + seeding; the worker must not race it.
      MIGRATE_ON_START: 'false'
      SEED_ON_START: 'false'
      CFGANALYZER_BINARY: /app/bin/cfganalyzer

    depends_on:
      postgres:
        condition: service_healthy
      # Let the app run the entrypoint's dep-sync + migrations first (shared node_modules
      # volume), so the worker starts against an already-prepared image/schema.
      app:
        condition: service_started

    volumes:
      - .:/app:cached
      - afct-dev-node-modules:/app/node_modules
      # Same private-uploads volume the app writes submissions into. Left writable in dev
      # (the container runs as root, and the entrypoint chowns /private/uploads on start —
      # a :ro mount just makes that chown log harmless "Read-only file system" noise). Prod
      # keeps it :ro because the prod worker runs as the non-root node user, so it never chowns.
      - afct-dev-private-uploads:/private/uploads

    healthcheck:
      disable: true

  nginx:
    # Same custom image as prod. Config + entrypoint are bind-mounted below so
    # they can be edited live; the mounts override the baked copies.
    build:
      context: ./docker/nginx
    container_name: afct-dev-nginx
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      app:
        condition: service_started

    environment:
      # Dev publishes HTTPS on 8443, so the plain-HTTP redirect has to name that port. Without
      # it nginx sends the browser to https://localhost/ (port 443), where nothing is listening.
      HTTPS_PORT: '8443'

    ports:
      - '8080:80'
      - '8443:443'

    volumes:
      - nginx_certs:/etc/nginx/certs
      - afct-dev-uploads-data:/usr/share/nginx/html/uploads
      - afct-dev-tls-certs:/etc/nginx/custom-certs:ro
      - afct-dev-acme-challenge:/var/www/acme-challenge:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/entrypoint.sh:/entrypoint.sh:ro

    healthcheck:
      disable: true

  postgres:
    # Digest-pinned (tag kept for readability). Bump deliberately.
    image: postgres:15-alpine@sha256:cd17e2ac98240fce1541ad2a803b34009b4eea5aec8a832363cdc7eca62e722e
    container_name: afct-dev-postgres
    logging: *default-logging

    environment:
      POSTGRES_DB: afct
      POSTGRES_USER: afct_user
      POSTGRES_PASSWORD: afct_pass

    ports:
      - '5432:5432'

    # Stated rather than inherited. The stock ceiling is 100, and it is reached by ordinary
    # local work: the app, the worker, the backup sidecar, Prisma Studio and a database test
    # run each hold a pool. When it is hit, the app crash-loops on its startup migration and
    # the database suite fails in ways that read like a code regression, which is exactly what
    # happened once. `log_connections` is on for the same reason prod has it: so the next time
    # something eats connections, the log names it instead of leaving us guessing.
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afct_user -d afct']
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    # Mirrors the prod backup service so backups work in dev too, daily schedule
    # from System Settings plus the on-demand "back up now" trigger.
    #
    # The BUILT image, not raw postgres: backup.sh needs GNU tar (it repeats -C to put the
    # dump and the uploads in one archive) and gpg, which the Dockerfile installs. On the raw
    # image, busybox tar silently wrote archives with no database in them and every backup
    # failed verification. The bind mount below still shadows the baked-in script, so
    # backup.sh stays live-editable in dev.
    build:
      context: ./docker/backup
    container_name: afct-dev-db-backup
    restart: unless-stopped
    logging: *default-logging

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGUSER: afct_user
      PGDATABASE: afct
      POSTGRES_PASSWORD: afct_pass
      BACKUP_ENABLED: 'true'
      BACKUP_HOUR: '2'
      BACKUP_RETENTION_DAYS: '14'

    entrypoint: ['/bin/sh', '/backup.sh']
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - afct-dev-db-backups:/backups
      - afct-dev-private-uploads:/snapshot/private-uploads:ro
      - afct-dev-uploads-data:/snapshot/public-uploads:ro
      - afct-dev-backup-triggers:/backup-triggers

  prisma-studio:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: afct-prisma-studio
    restart: 'no'
    logging: *default-logging

    environment:
      DATABASE_URL: postgres://afct_user:afct_pass@postgres:5432/afct

    command: ['npx', 'prisma', 'studio', '--port', '5555', '--browser', 'none']

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - '5555:5555'

    volumes:
      - .:/app:cached
      - afct-dev-node-modules:/app/node_modules

  # A local mail server for development. Catches every message AFCT sends and shows it in a
  # web UI at http://localhost:8025, so the password-reset link can actually be clicked rather
  # than guessed at. Nothing leaves this machine, which is the point: a dev database full of
  # test accounts must never be able to mail real people.
  #
  # Configure it on the Email tab as host `mailpit`, port 1025, encryption **None**. Mailpit
  # speaks neither STARTTLS nor authentication out of the box, so the STARTTLS-plus-credentials
  # path that a real campus server uses is not exercised here. Prove that separately against
  # Ethereal (https://ethereal.email), which hands out throwaway accounts that do both.
  mailpit:
    image: axllent/mailpit:latest
    container_name: afct-dev-mailpit
    restart: unless-stopped
    logging: *default-logging

    ports:
      # 1025 SMTP (what AFCT connects to), 8025 web UI (where you read the mail).
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_dev_data:
  nginx_certs:
  afct-dev-node-modules:
  afct-dev-next:
  afct-dev-private-uploads:
  afct-dev-uploads-data:
  afct-dev-tls-certs:
  afct-dev-acme-challenge:
  afct-dev-db-backups:
  afct-dev-backup-triggers:
  # Empty stand-ins that hide the docs site's build artefacts from the container. See the
  # note on the app service's volumes.
  afct-dev-docs-node-modules:
  afct-dev-docs-build:
  afct-dev-docs-cache:
