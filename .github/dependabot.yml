# Dependabot configuration.
#
# For npm: SECURITY updates only (driven by the repo-level "Dependabot security
# updates" toggle), batched into a single PR per ecosystem instead of a stack of
# one-per-package PRs. `open-pull-requests-limit: 0` disables routine version-bump
# PRs; the `groups` blocks (applies-to: security-updates) collapse the security
# fixes into one grouped PR each. `schedule` is required syntactically but does not
# drive security updates (those trigger on alerts).
#
# GitHub Actions is the exception: routine bumps are enabled there, grouped and
# monthly. See the note on that block.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # These touch the shipped app, so tag them for prompt attention.
    labels:
      - dependencies
      - security
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  # The Docusaurus docs site has its own lockfile; without this entry Dependabot
  # never sees its advisories. Its deps are build-time only (the published site is
  # static HTML), so these are low-risk, but let Dependabot regenerate the lock.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Build-time deps for the static docs site; tag as development so they read as
    # low-priority next to the shipped-app PRs.
    labels:
      - dependencies
      - development
    groups:
      docs-npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Unlike npm, version bumps ARE wanted here: every action is pinned to a commit SHA,
  # and a pin nobody proposes moving just rots. That is how the codeql-action pin ended
  # up on a commit its own repository no longer reaches. Monthly and grouped, so this
  # arrives as one PR of comment-annotated SHA bumps, not a stack.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # CI workflow pins, not the shipped app; tag as development.
    labels:
      - dependencies
      - development
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      actions-versions:
        applies-to: version-updates
        patterns:
          - '*'
