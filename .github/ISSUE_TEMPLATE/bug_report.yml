name: Bug report
description: Report something in AFCT that is not working as expected.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AFCT. Please fill in the fields below so we can
        reproduce and fix the problem.

        **Do not report a security vulnerability here.** Use the private
        [security advisory](https://github.com/PennStateCS/AFCT/security/advisories/new)
        instead. See [SECURITY.md](https://github.com/PennStateCS/AFCT/blob/main/SECURITY.md).

        Please do not include a student's name, email, or graded work in a screenshot
        or log. Blur or remove it first.
  - type: dropdown
    id: institution
    attributes:
      label: Institution
      description: Which site is this being reported from?
      options:
        - College of the Holy Cross
        - Rochester Institute of Technology
        - The Pennsylvania State University
        - The University of New Mexico
        - University of Rochester
        - Other / evaluation install
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of AFCT does this affect?
      options:
        - Grades / gradebook
        - Assignments
        - Submissions / autograder
        - Problems
        - Groups / group sets
        - Roster / enrollment
        - Sign in / accounts
        - Admin (System Settings, Status, Backups, Updates)
        - Student client (the desktop submission app)
        - Documentation
        - Something else / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AFCT version
      description: >-
        Admins can read this from Dashboard -> System Status -> Server (AFCT Dashboard).
        If you do not know it, leave it blank.
      placeholder: e.g. v0.1.10
  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Admin
        - Faculty
        - TA
        - Student
        - Not signed in
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where did this happen?
      options:
        - Production / hosted install
        - Local development
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, in order, right before it went wrong?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      value: |
        - **Expected:**
        - **Actual:**
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      description: Only needed for a problem you see on a screen.
      placeholder: e.g. Chrome 130 on Windows 11
  - type: textarea
    id: context
    attributes:
      label: Screenshots, logs, or anything else
      description: Drag images straight into this box. Remember to remove student data first.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability (those go through the private advisory linked above).
          required: true
        - label: I searched existing issues and did not find this already reported.
          required: true
