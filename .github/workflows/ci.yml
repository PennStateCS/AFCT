name: CI

# Every pre-merge check in one place: lint, tests, and the API-docs/spec sync.
# The three jobs run in parallel. The image-publish workflow (publish-ghcr.yml)
# waits on this workflow succeeding on main before it builds a release image.
# A pull request runs everything. The run on `main` after a merge is narrower on purpose:
# it exists to catch what only a merge can break, which is two branches that each passed
# alone and conflict once combined. Nothing about the merge commit can change whether the
# tree lints, whether a Dockerfile is well formed, or whether the API docs are in sync, so
# those jobs are skipped there. `e2e` is skipped for the same reason plus a practical one:
# it is eight of the nine minutes, and a merge interaction that only a browser can see is
# not what it is good at finding. It still runs on every pull request.
#
# The secret scan is the exception and runs on both. Its value does not depend on the merge
# commit being content-identical to the branch, and it costs under a minute; "we stopped
# scanning main" is not a sentence worth saving that minute for.
on:
  push:
    branches: ['main']
    # Docs-only pushes don't need app CI, and skipping it also skips the GHCR
    # image build that runs after it (the repo is private, so runner minutes
    # are metered).
    paths-ignore:
      - 'docs-site/**'
      - 'docs/**'
      - '**.md'
  pull_request:
  # So the release gate has an answer when CI never ran on a commit: run it on that ref by
  # hand rather than tagging something untested, or loosening the gate. A dispatch runs the
  # FULL suite (everything a pull request gets, e2e included), because its whole purpose is
  # to stand in for the validation a commit never had.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Secrets are a hard gate rather than a warning, because the cost of a miss is unbounded: a
  # key in git history stays there after the commit that removed it, so the only cheap moment to
  # catch one is before it lands.
  #
  # The action scopes its scan to the commits in the event, which is what makes it a *gate* on
  # new work rather than a re-litigation of the past on every run. The full history was scanned
  # once by hand when this was added and was clean.
  #
  # CodeQL already runs as SAST (GitHub default setup, so it has no workflow file here) and
  # Dependabot handles dependencies. This is the third leg neither of those covers.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # The whole history, not just the tip: a secret is still a secret three commits back,
          # and a shallow clone would find nothing in the one place it most matters.
          fetch-depth: 0

      # The tool, not the action. `gitleaks-action` requires a paid licence for repositories
      # owned by an organisation, and fails in seconds without one; gitleaks itself is MIT.
      # Pinned by version and checked against its digest, because a binary fetched at CI time
      # and run over the whole repository is exactly the thing not to take on trust.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # The whole history rather than the pushed range: it takes three seconds, and a secret
          # three commits back is still a secret.
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Lint doesn't need the generated Prisma client; skipping keeps CI fast.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          SKIP_PRISMA_GENERATE: '1'

      # Hard gate: the codebase is lint-clean (0 errors, 0 warnings). `--max-warnings=0`
      # makes any new finding (warning or error) fail the job and block the merge.
      # (`npm run lint` stays warning-tolerant for local dev.)
      - name: ESLint
        run: npm run lint -- --max-warnings=0

  # Dockerfile linting. Five Dockerfiles ship to other institutions, and hadolint runs
  # ShellCheck over every RUN block, which nothing else here does. See .hadolint.yaml for
  # which rules are off and why.
  dockerfiles:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # The binary rather than the action, and checked against its digest, for the same
      # reason gitleaks is fetched this way above.
      - name: Lint the Dockerfiles
        env:
          HADOLINT_VERSION: 2.12.0
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
        run: |
          set -euo pipefail
          curl -sSfL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint docker/Dockerfile docker/Dockerfile.dev docker/nginx/Dockerfile \
            docker/updater/Dockerfile docker/backup/Dockerfile

  # Unused dependencies and imports that were never declared. Scoped to those two checks:
  # knip also reports unused files and exports, which on this codebase is mostly deliberate
  # convention (shadcn primitives kept whole, types exported for symmetry) and would make
  # the gate noise rather than signal. Run `npx knip` locally to see the full picture.
  deadcode:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          SKIP_PRISMA_GENERATE: '1'

      - name: Check for unused and undeclared dependencies
        run: npm run knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `postinstall` generates the Prisma client (tests import enums/types from
      # @prisma/client).
      # tests. No database is required; the tests mock Prisma at runtime.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

  # The `*.db.test.ts` suite, against a real Postgres. These cover what the mocked
  # tests structurally cannot: whether two concurrent conditional updates really
  # produce one winner, whether constraints and cascades behave as the services
  # assume. Separate job so a database problem never masquerades as a unit failure.
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Same major + digest as docker-compose.dev.yml and deploy/docker-compose.yml.
        # Testing transaction and constraint behavior against a different Postgres than
        # we actually run would defeat the point of these tests.
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_DB: afct_test
          POSTGRES_USER: afct_user
          POSTGRES_PASSWORD: afct_pass
        ports:
          - 5432:5432
        # Without this the job races the database and fails on connection refused.
        options: >-
          --health-cmd "pg_isready -U afct_user -d afct_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite's setup file refuses any database not named afct_test.
      DATABASE_URL: postgresql://afct_user:afct_pass@localhost:5432/afct_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # `migrate deploy`, not `db push`: it applies the committed migration files, so a
      # migration that is broken or missing fails here rather than in production.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run database tests
        run: npm run test:db

  docs-check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Doc generation needs js-yaml + the validators and the ERD generator, but not
      # the Prisma client itself.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          SKIP_PRISMA_GENERATE: '1'

      # `docs` validates the spec (failing on a malformed @openapi block or an
      # invalid document), regenerates the typed client, and redraws the ERD.
      - name: Generate and validate spec + types + ERD
        run: npm run docs

      - name: Ensure generated API types are committed and in sync
        run: |
          if ! git diff --quiet -- src/types/api.ts; then
            echo "::error::src/types/api.ts is out of date. Run 'npm run docs' and commit the result."
            git --no-pager diff -- src/types/api.ts
            exit 1
          fi

      - name: Ensure the published ERD matches the schema
        run: |
          if ! git diff --quiet -- docs-site/docs/reference/database-schema.md; then
            echo "::error::The published ERD is out of date. Run 'npm run docs' and commit the result."
            git --no-pager diff -- docs-site/docs/reference/database-schema.md
            exit 1
          fi

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # postinstall generates the Prisma client (tsc needs its types).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (app + tests)
        run: npm run typecheck:all

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Same build the prod image runs; ESLint is skipped here (the lint job covers
      # it). No DB or secrets are needed at build time.
      - name: Production build
        run: npm run build
        env:
          NEXTJS_IGNORE_ESLINT: '1'
          NEXT_TELEMETRY_DISABLED: '1'

  # Golden test for the evaluator jar itself: runs jars/afct-evaluator.jar (the exact
  # artifact the image ships) against known submission/answer pairs and asserts the
  # verdict, so a regressed or mis-swapped evaluator fails the build rather than silently
  # mis-grading students. Add cases under test/evaluator (see test/evaluator/README.md).
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # JRE 21 matches the runtime image (eclipse-temurin:21-jre) so we grade with the
      # same Java the jar was validated on.
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # JFLAP initializes Swing even in CLI mode; without fontconfig + a font the JRE
      # throws "Fontconfig head is null". The runtime image installs the same packages.
      - name: Install evaluator font dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core

      # Belt and braces: the binary is stored 100755, so this is normally a no-op. Kept
      # because a checkout on a filesystem that drops the mode would otherwise fail the
      # fourteen CFG and PDA cases with the binary's own path quoted as a counterexample,
      # which reads like a grading bug rather than a permissions one.
      - name: Make cfganalyzer executable
        run: chmod +x bin/cfganalyzer

      # The runner uses only Node built-ins + lib/java-runner.js, so no npm install.
      - name: Run evaluator golden tests
        run: npm run test:evaluator

  # The browser smoke suite: the axe accessibility scan plus the focus, keyboard and
  # workflow checks. These existed for a while without any workflow running them, which
  # let a spec go stale against an API change nobody noticed, so this job is what makes
  # them mean anything.
  #
  # Unlike `test`, this needs a database, a seeded one, and a browser. The dev server is
  # started by playwright itself (see the note in playwright.config.ts on why it is `next
  # dev` and not a production build).
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # 30, not 20: the suite itself runs in about 16 minutes, and a slow cold compile of the
    # dev server on the runner (five minutes on one occasion) then took the whole job past
    # the limit and cancelled it mid-run. Raise this again rather than trimming a real
    # check, but if it ever needs 30 the suite has grown past what a smoke suite should be.
    timeout-minutes: 30

    services:
      postgres:
        # Same image as the test-db job and as production.
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
          POSTGRES_DB: afct_test
          POSTGRES_USER: afct_user
          POSTGRES_PASSWORD: afct_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afct_user -d afct_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # playwright.config.ts defaults to this, and the suite refuses any other database.
      E2E_DATABASE_URL: postgresql://afct_user:afct_pass@localhost:5432/afct_test
      DATABASE_URL: postgresql://afct_user:afct_pass@localhost:5432/afct_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # `migrate deploy` + `db seed` rather than `npm run e2e:db`: that script resets the
      # database through `docker exec` against the dev stack's container, which does not
      # exist here. The service container starts empty, so there is nothing to reset.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Gives the known admin/faculty/TA/student accounts the specs sign in as.
      - name: Seed the database
        run: npx prisma db seed

      # `--with-deps` installs the system libraries the browser needs; without them it
      # exits 127 and every spec fails at launch, which looks nothing like a test failure.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the browser suite
        run: npx playwright test

      # The traces and screenshots are what make a failure here diagnosable; a browser
      # failure is rarely obvious from the log alone.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e-report/
            test-results/
          retention-days: 7
